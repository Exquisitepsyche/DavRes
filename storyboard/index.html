<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VAO Shotbook</title>
<meta name="description" content="Reference and storyboard app for architecture and real estate films: feelings to camera recipes, 169 techniques with their effect on the viewer, story arcs, a 3D previs villa, sun planner and shoot plan.">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Montserrat:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#feel" aria-label="VAO Shotbook home"><b>VAO</b><i></i><span>Shotbook</span></a>
  <nav class="nav" id="app-nav" aria-label="Main"></nav>
  <div class="bar-right">
    <span class="proj-pill muted" id="proj-pill"></span>
    <button class="iconbtn" id="theme" type="button" aria-label="Switch theme"></button>
  </div>
</header>

<main id="view" tabindex="-1"></main>

<nav class="tabbar" id="tabbar" aria-label="Main"></nav>

<div class="scrim" id="scrim" hidden></div>
<aside class="sheet" id="sheet" hidden aria-label="Details">
  <div class="sheet-head">
    <span class="label"></span>
    <button class="iconbtn sheet-close" type="button" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="sheet-body"></div>
</aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<noscript><p style="padding:24px">VAO Shotbook needs JavaScript.</p></noscript>

<script src="vendor/three.min.js"></script>
<script src="js/previs.js"></script>
<script src="js/shots.js"></script>
<script src="js/data-library.js"></script>
<script src="js/data-feel.js"></script>
<script src="js/data-arcs.js"></script>
<script src="js/data-options.js"></script>
<script src="js/sun.js"></script>
<script src="js/diagrams.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
